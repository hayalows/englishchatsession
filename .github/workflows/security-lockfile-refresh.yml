name: One-time security lockfile regeneration

# This file is temporary and must be removed before merging the PR.
# GitHub-token pushes do not re-trigger workflows; the final PR CI is rerun
# by the later commit that removes this file.
on:
  push:
    branches:
      - security/englishchat-hardening-20261026

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.repository == 'hayalows/englishchatsession'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Resolve patched dependency versions
        run: |
          npm install --package-lock-only --ignore-scripts --no-fund
          npm audit fix --package-lock-only --ignore-scripts --no-fund
          npm ci --no-fund
      - name: Update only the security branch's lockfile
        shell: bash
        run: |
          if ! git diff --quiet -- package.json package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "chore(security): regenerate audited npm lockfile"
            git push origin HEAD:security/englishchat-hardening-20261026
          fi
      - name: Repository quality gates
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
